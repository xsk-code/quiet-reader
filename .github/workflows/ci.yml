name: Test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run verify
      - run: npm run doctor -- --json --require-model
        env:
          READER_TEXT_PROVIDER: api
          READER_API_BASE_URL: http://127.0.0.1:11434/v1
          READER_TEXT_MODEL: offline-configuration-check
          READER_IMAGE_PROVIDER: none
